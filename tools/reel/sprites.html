<!doctype html>
<!-- Sprite sheet for the post-rendered FigJam cursor. reel.js screenshots each
     element with a transparent background; render.py composites them. -->
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:ReelInter;src:url(../../tests/fonts/inter.woff2) format('woff2');font-weight:100 900;}
  html,body{margin:0;background:transparent;}
  body{font-family:ReelInter,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:20px;}
  .s{display:inline-block;padding:12px;vertical-align:top;line-height:0;}
  svg{display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));}
  .tag{display:inline-block;vertical-align:top;line-height:1.2;white-space:nowrap;background:var(--c);color:var(--ink);
    font-size:15px;font-weight:600;letter-spacing:-.01em;padding:5px 10px 6px;border-radius:4px 12px 12px 12px;
    box-shadow:0 2px 6px rgba(0,0,0,.25), inset 0 0 0 1.5px rgba(255,255,255,.35);}
  .tag.chat{padding:7px 14px 10px;border-radius:4px 18px 18px 18px;max-width:440px;white-space:normal;}
  .tag.chat .nm{display:block;font-size:12px;font-weight:600;opacity:.85;}
  .tag.chat .tx{display:block;font-size:19px;font-weight:500;line-height:1.25;margin-top:1px;}
  .emoji{font-family:'Apple Color Emoji','Noto Color Emoji',sans-serif;}
</style></head><body></body></html>
