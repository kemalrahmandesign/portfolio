<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kemal Rahman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Page tone, taken from the Figma reference. */
  --bg:#f1f0ee;
  --ink:#0a0a0a;

  /* Video is not lifted any more, and the 1.085 that used to sit here was a
     measurement error worth recording.

     The old comment read: "the clips render their studio at about 222
     luminance, the design sits nearer 241". 222 is the WHOLE-FRAME mean, which
     averages the white studio together with his dark hair, clothes and the
     black motorcycle. It is not the studio. Measured on the studio alone, the
     clips sit at 237 (wave), 238 (idle) and 242 (walk), against a page at 240.
     They already matched.

     Multiplying an already-matched 237-242 by 1.085 gives 257-262, which
     clips: 88.8% of studio pixels pinned at pure 255, every bit of shading in
     the white room crushed flat, and the picture reading brighter than the
     page it is supposed to sit inside. It also set up the handoff to blow out,
     which is what the removed .settle taper existed to paper over.

     Do not match a flat background colour against a frame mean. Mask to the
     pixels that are meant to correspond. */
  --clip-lift:1;
  --clip-warm:1.02;

  --pad:clamp(20px,3.4vw,64px);
  /* Measured off the Figma frame (2000x1102): the headline cap height is
     165px, which at Inter's 0.727 cap ratio is a 227px face, or 11.35vw.

     The vh cap is the part that matters in a browser. 11.35vw is sized off
     the WIDTH, but what the masthead collides with is a HEIGHT: his hair
     starts at 28.6% of the frame, measured on the hub frame, and on any
     viewport narrower than 16:9 that is 28.6% of the viewport too. Sized on
     width alone the headline grows at wide viewports and pushes the tagline
     down onto him, which is exactly what happened at 16:9 and at the
     reference's own 1.815. Capping at 17.5vh holds the tagline clear of him
     across desktop shapes. It costs about 3% of the headline's size at
     laptop aspects, which is imperceptible, against a tagline sitting on his
     hair, which is not. */
  --head:clamp(40px,min(11.35vw,17.5vh),232px);
  --tag:clamp(13px,1.38vw,29px);
  --stage-max:1800px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;width:100%;overflow:hidden;isolation:isolate}

.stage{position:absolute;inset:0;z-index:0}
/* Layers start transparent and are driven entirely from the script. There is
   deliberately no transition here: fading two stacked layers at once lets the
   page background show through the middle of the blend, which reads as a
   flash on every swap. The script raises the incoming layer over an outgoing
   one that stays fully opaque, so the two always sum to a solid picture. */
.stage video,.stage img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center bottom;
  filter:brightness(var(--clip-lift)) saturate(var(--clip-warm));
  opacity:0;z-index:1;
}

/* Portrait: letterbox rather than crop.
   The clips are 16:9. Covering a portrait viewport scales them to fill the
   height, which on a phone leaves about 26% of the frame width visible -- a
   narrow vertical slice. That is fatal for this shot specifically, because the
   walk pans right to the desk: with cover you watch him leave and then stare at
   empty studio. Containing shows the whole frame as a band against --bg, which
   the stage already paints, so the composition survives.

   The same applies at the other extreme. Past 2:1 the crop comes off the top
   instead, and it takes 360px at 21:9, which puts his hair at 4.8% of the
   viewport: no masthead can clear that, and the headline would sit across
   his face. Both ends letterbox for the same reason, that cover throws away
   the part of the composition the layout is positioned against.

   The portrait half of this is interim until the 9:16 regeneration; that is
   the real fix, and it replaces the max-aspect half of this query. */
@media (max-aspect-ratio:1/1),(min-aspect-ratio:2/1){
  .stage video,.stage img{object-fit:contain;object-position:center center}
}

/* Ease the lift back to 1 over the take.

   --clip-lift is calibrated for the hero, where the studio renders near 222 and
   wants to sit at 241. By the end of the walk the picture is almost entirely
   the monitor's white panel, which the clip already renders at about 235.
   Multiplying that by 1.085 gives 255 on all three channels, so it clips: the
   panel arrives as blown pure white and the hue clips away with the level. That
   is what read as a harsh cold white at the handoff, next to a page that is
   actually a warm 240. Easing the lift out over the same 450ms as the cover
   lets the panel arrive at its own value, against a cover painted in --bg. */
/* No .settle taper any more. It eased --clip-lift back to 1 over the last
   450ms so the white panel would not arrive blown out. With the lift at 1
   there is nothing to ease: the panel arrives at its own value, and that value
   is within a couple of levels of --bg.

   It never worked anyway, for the reason documented on .zoom below: it
   declared its transition on the state class, so the filter snapped instead of
   easing. Every description of it in the notes as "easing out over 450ms" was
   describing an instant jump. */

/* Drive the monitor the rest of the way to full frame.

   The take ends with the panel head on but only filling 70% of the width and
   68% of the height, measured on the final frame, with the bezel and a band of
   studio still around it. The camera cannot be pushed further inside the clip
   without regenerating it, so the last bit of the move is done here.

   Scale 1.5 clears the measured 1.47 needed to cover, with margin so no bezel
   survives at any viewport aspect. The origin is the panel's centre in the
   final frame -- 53.5% across, 45.8% down -- not the middle of the screen,
   because the panel does not sit centred. */
/* A keyframe animation, not a transition, and that is load-bearing twice over.

   A transition cannot start when the `transition` property is introduced by
   the same style change that sets the new value: there is no previous state
   carrying the transition, so the value snaps. Declaring
   `transition:transform ...` inside `.zoom` alongside `transform:scale(1.5)`
   is exactly that mistake, and it made the push-in teleport. Measured: the
   computed scale went 1 -> 1.5 between consecutive 50ms samples.

   Moving the transition to the base rule would fix that but break on the other
   side, because show() writes an inline `transition` for the crossfade and an
   inline declaration beats the stylesheet, so the transform transition would
   be dropped whenever a layer was swapped. `animation` is a separate property,
   so it survives both. */
/* The push has to land the panel centred, not just make it bigger.

   Scaling about the panel's own centre pins that point and streams everything
   else outward around it. Because the panel sits at 53.5% across and 45.8%
   down rather than dead centre, the pinned point is off-axis and the move
   reads as drifting diagonally instead of pushing straight in.

   Scaling about the element centre and translating by the offset fixes the
   axis. A point p (as a fraction of the box) lands at 0.5 + (p - 0.5)*s, so
   bringing the panel centre to 0.5 needs t = -(p - 0.5)*s:
     x: -(0.535 - 0.5) * 1.5 = -5.25%
     y: -(0.458 - 0.5) * 1.5 = +6.30%
   The panel then travels to the middle of the screen as it grows, which is
   what a dolly toward it looks like. */
@keyframes pushin{
  from{transform:translate(0,0) scale(1)}
  to  {transform:translate(-5.25%,6.3%) scale(1.5)}
}
.stage video.zoom{
  animation:pushin 1400ms cubic-bezier(.33,0,.2,1) forwards;
}

/* Shown only when the clips cannot be fetched, so the layout still reads. */
.stage-missing{
  position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
  width:min(62%,880px);aspect-ratio:16/9;
  border:2px dashed rgba(10,10,10,.22);border-radius:12px;
  display:none;place-items:center;text-align:center;
  color:rgba(10,10,10,.42);font-size:14px;line-height:1.5;padding:20px;
}
.stage.is-empty .stage-missing{display:grid}

.overlay{
  position:relative;z-index:2;min-height:100svh;
  max-width:var(--stage-max);margin:0 auto;
  /* The reference sets the headline 12.3% of the frame height down. In the
     browser that sat the tagline on his head, because the reference frame is
     1.815 and the clips are 16:9 cover-cropped, so he rides higher here than
     he does in the Figma. Pulled up to 7.5vh, which clears him. */
  padding:clamp(16px,3.2vh,56px) var(--pad) var(--pad);
  /* auto auto 1fr, not auto 1fr: with two children the second would take the
     1fr row and stretch to the bottom of the viewport. Harmless to look at,
     since its contents sit at the top of that box, but it makes every
     measurement of the tagline wrong. The empty third row absorbs the slack
     instead. */
  display:grid;grid-template-rows:auto auto 1fr;pointer-events:none;
}

/* ---------- headline ---------- */
/* -.055em is measured, not judged. The reference sets "Kemal Rahman" 1520px
   wide at a 227px face. Inter 800 at -.055em renders it 1518.2px; -.05em was
   12px wide and -.06em 15px narrow. */
h1{
  margin:0;font-weight:800;letter-spacing:-.055em;line-height:.9;
  font-size:var(--head);
  /* Centred on the frame, which is where he stands, rather than flush left. */
  text-align:center;
}

/* The tagline reads as one line broken around him: "A seriously good" to his
   left, "Product designer" to his right, both on the same baseline and
   symmetric about the centre. In the reference their centres sit at 35.8% and
   64.3%, so the gap between them is 16.2% of the width. A flex row with that
   gap keeps them symmetric at any width, which matters because he is centred
   in the frame and the gap is what clears his head. */
.tagline{
  margin:clamp(10px,1.7vh,30px) 0 0;
  display:flex;justify-content:center;align-items:baseline;
  gap:clamp(64px,16.2vw,330px);
  font-size:var(--tag);font-weight:700;letter-spacing:-.005em;
  white-space:nowrap;
}
.tagline span{
  display:inline-block;opacity:0;transform:translateY(14px);
  transition:opacity .6s ease .26s,transform .6s cubic-bezier(.16,1,.3,1) .26s;
}
.tagline .t-right{transition-delay:.35s}
.is-in .tagline span{opacity:1;transform:none}
.word{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.word > span{
  display:inline-block;transform:translateY(110%);
  transition:transform .82s cubic-bezier(.16,1,.3,1);
}
.is-in .word > span{transform:translateY(0)}

/* ---------- call to action ---------- */
/* Pulled out of the grid flow so it sits at the middle of the screen rather
   than the middle of whatever space the headline leaves behind. */
/* Reference puts the pill's right edge 11% in from the frame edge and its
   centre at 50.8% of the height, which lands it beside his shoulder rather
   than hard against the margin.

   It sits in .hero rather than in .overlay deliberately. .overlay is capped at
   --stage-max and centred, so an inset measured inside it is relative to the
   text column, not the frame: at a 2000px viewport that put the pill 16% in
   instead of 11%. He is centred in the video, which is full bleed, so the
   pill has to be positioned against the same box the video fills. */
.cta-wrap{
  position:absolute;z-index:2;top:50.8%;transform:translateY(-50%);
  right:clamp(16px,11vw,260px);
  display:flex;align-items:center;justify-content:flex-end;
  pointer-events:none;
}
.cta{
  position:relative;
  pointer-events:auto;appearance:none;cursor:pointer;
  font:inherit;font-weight:700;font-size:clamp(15px,1.5vw,31px);
  letter-spacing:-.01em;color:var(--ink);background:transparent;
  border:0;border-radius:999px;
  padding:.7em 1.5em;display:inline-flex;align-items:center;gap:.6em;
  opacity:0;transform:translateY(14px);
  transition:opacity .55s ease .45s,transform .55s cubic-bezier(.16,1,.3,1) .45s,
             color .18s ease;
}

/* The dashes travel around the pill.

   The border is an SVG rounded rect rather than `border:2px dashed`, because a
   CSS border cannot be animated around its own perimeter. `pathLength="100"`
   normalises the outline to 100 units whatever the button's real size, so one
   dash period is 12 units at every breakpoint and the loop is seamless: the
   offset moves exactly one period per cycle. */
.cta .ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  pointer-events:none;color:inherit}
.cta .ring rect{
  fill:none;stroke:currentColor;
  /* An SVG rect clamps rx to half its WIDTH and ry to half its HEIGHT,
     independently. So rx="999" on a wide short box gives a 145px horizontal
     radius against a 39px vertical one: an ellipse, not a pill. Measured, a
     999 radius in any form leaves only 8.3% of the outline flat along the
     top; a real pill leaves 33.8%.

     A pill needs rx = ry = height/2, and CSS cannot express "half the
     height", so the script measures the button and writes it here. The em
     fallback covers the frame before that runs and is right at the current
     metrics; the measured value is what keeps it right when the face, the
     padding or the clamp changes. */
  rx:var(--ring-r,1.27em);
  ry:var(--ring-r,1.27em);
  /* ~25 dashes around the pill, matching the reference's density. With
     pathLength="100" a dash is 2% of the perimeter whatever the button's real
     size, so the density holds at every breakpoint. */
  stroke-dasharray:2 2;
  /* In em so the outline keeps its weight relative to the pill as the
     font-size clamp moves: 2px was a hairline once the button grew. */
  stroke-width:.13em;
  animation:ants 2s linear infinite;
}
/* Clockwise: an SVG rect is drawn clockwise from its top-left, and a negative
   dashoffset advances the dashes along that direction. One period is 4 units,
   so shifting by exactly -4 per cycle makes the loop seamless; a full lap
   takes 50s, which is the slow drift asked for rather than a chase. */
@keyframes ants{ to{stroke-dashoffset:-4} }

.is-in .cta{opacity:1;transform:translateY(0)}

/* Pressed during the greeting: the press is banked, not refused. The dashes
   speed up so the button reads as working rather than broken, and the take
   starts the moment he finishes waving. */
.hero.armed .cta{cursor:default}
.hero.armed .cta .ring rect{animation-duration:.55s}
/* The pill stays unfilled. Hover thickens and darkens the outline rather
   than flooding it, because a solid fill at this size covers a good part of
   the shot behind it. */
.cta:hover,.cta:focus-visible{color:var(--ink)}
.cta:hover .ring rect,.cta:focus-visible .ring rect{stroke-width:.18em}
.cta:focus-visible{outline:none}
.cta .arw{transition:transform .18s ease}
.cta:hover .arw{transform:translateX(4px)}

/* ---------- clearing the plate for the take ----------
   The headline and the call to action have done their job by the time he
   starts walking, and holding them over the shot fights the camera move: the
   push-in ends on the monitor dead centre, which is exactly where the headline
   sits. They fade together, with the skip link, over roughly the same time as
   the blend into the walk.

   Fading .overlay rather than its children means one group opacity animates
   instead of two independent ones, so the headline and the button cannot drift
   apart. The skip link is a sibling of .overlay, not a child, so it needs its
   own rule. */
/* Fade the pieces, not the container.

   The first version animated opacity on .overlay, which is a full-viewport
   element stacked over the playing video. Animating opacity on a layer that
   size makes the compositor promote it for the duration of the transition and
   re-rasterise, and that re-raster over a decoding video reads as a one-frame
   flash. Kemal saw it immediately.

   The headline, the button and the skip link are small, so promoting them
   costs nothing. They share a duration and easing and start in the same frame,
   so they still leave together. */
#headline,.tagline,.cta,.skip{transition:opacity 420ms ease}
.hero.is-leaving #headline,
.hero.is-leaving .tagline,
.hero.is-leaving .skip{opacity:0}
/* .cta carries a 550ms entry delay from .is-in; restate the transition so
   leaving is not held back by it. */
.hero.is-leaving .cta{opacity:0;transition:opacity 420ms ease}
.hero.is-leaving .cta,
.hero.is-leaving .skip{pointer-events:none}

/* ---------- skip ---------- */
.skip{
  position:absolute;left:var(--pad);bottom:var(--pad);z-index:3;pointer-events:auto;
  appearance:none;border:0;background:transparent;font:inherit;font-size:14px;
  color:var(--ink);opacity:.45;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;
}
.skip:hover{opacity:.85}

/* ---------- the handoff ---------- */
/* The monitor's power-on flicker happens inside the clip, so this cover has
   only one job: close the gap between the video's white and the page's white.

   It used to be #fff, on a comment that claimed the page was 255. The page is
   --bg, which is #f1f0ee, luminance 240. So the cover ramped up to pure white
   and then cleared 15 levels down onto the real page: it created a step at the
   end of the reveal to hide one in the middle. Painting the cover in --bg
   instead means clearing it is a no-op, because it is already the page colour. */
#cover{
  position:fixed;inset:0;z-index:40;background:var(--bg);
  opacity:0;pointer-events:none;
}
#cover.take{animation:take 450ms ease-in forwards}
@keyframes take{from{opacity:0} to{opacity:1}}
#cover.clear{opacity:0;transition:opacity .5s ease}

/* ---------- inside the monitor ----------
   The take ends by filling the screen with the monitor's white panel, so what
   is underneath has to read as being on that screen rather than as a new page
   arriving. That means no card grid and no section heading: the camera has
   just landed, and a wall of chrome would undo the move. A held statement,
   then a reason to keep going. */
.work{
  min-height:100svh;max-width:var(--stage-max);margin:0 auto;
  padding:var(--pad);display:grid;grid-template-rows:1fr auto;
}
.intro{
  align-self:center;max-width:22ch;
  font-size:clamp(30px,5.2vw,78px);font-weight:800;
  letter-spacing:-.04em;line-height:1.04;margin:0;
}
.intro .dim{color:rgba(10,10,10,.34)}

/* The lines rise in once the camera has landed, rather than being there
   already. Transitions live on the base rule, not on .in: a transition
   introduced by the same style change that sets the new value does not run,
   which is the bug that made the monitor push-in teleport. */
.intro .line{
  display:block;opacity:0;transform:translateY(20px);
  transition:opacity .75s ease,transform .75s cubic-bezier(.16,1,.3,1);
}
.intro .line:nth-child(2){transition-delay:.14s}
.work.in .intro .line{opacity:1;transform:none}

.scroll{
  justify-self:center;display:flex;flex-direction:column;align-items:center;gap:.7em;
  padding-bottom:clamp(18px,3vh,40px);
  font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(10,10,10,.42);
  opacity:0;transform:translateY(10px);
  transition:opacity .6s ease .5s,transform .6s ease .5s;
}
.work.in .scroll{opacity:1;transform:none}
.scroll .chev{width:18px;height:18px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0);opacity:.5} 50%{transform:translateY(5px);opacity:1}}

@media (max-width:760px){
  h1{font-size:clamp(34px,12.5vw,86px)}
  /* The gap exists to clear him, and on a phone there is not enough width for
     both phrases plus a gap that wide. They stack and centre instead. */
  .tagline{
    flex-direction:column;align-items:center;gap:.25em;
    font-size:clamp(12px,3.4vw,18px);
  }
  .cta-wrap{
    top:auto;bottom:14vh;transform:none;
    left:0;right:0;justify-content:center;
  }
}
@media (prefers-reduced-motion:reduce){
  .scroll .chev{animation:none}
  .cta .ring rect{animation:none}
  .stage video.zoom{animation:none}
  .intro .line,.scroll,.tagline span{transition:none;opacity:1;transform:none}
  .word > span{transition:none;transform:none}
  .cta{transition:none;opacity:1;transform:none}
  #cover.take{animation:none;opacity:1}
  #headline,.cta,.skip{transition:none}
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="stage" id="stage">
    <img id="poster" alt="" src="">
    <video id="vidA" playsinline muted preload="auto"></video>
    <video id="vidB" playsinline muted preload="auto"></video>
    <video id="vidC" playsinline muted preload="auto"></video>
    <div class="stage-missing">
      Scene clips can&rsquo;t be fetched from here.<br>
      Layout, type and motion above are live.
    </div>
  </div>

  <div class="overlay">
    <h1 id="headline">Kemal Rahman</h1>
    <p class="tagline">
      <span class="t-left">A seriously good</span>
      <span class="t-right">Product designer</span>
    </p>
  </div>

  <div class="cta-wrap">
      <button class="cta" id="cta">
        <svg class="ring" aria-hidden="true" focusable="false">
          <rect width="100%" height="100%" pathLength="100"/>
        </svg>
        Cool Sh*t <span class="arw">&rarr;</span>
      </button>
  </div>

  <button class="skip" id="skip">Skip intro</button>
</section>

<main class="work" id="work" hidden>
  <p class="intro">
    <span class="line">Product designer, four&nbsp;years in.</span>
    <span class="line dim">Most of the work is deciding what not to build,
    then making what&rsquo;s left feel obvious.</span>
  </p>
  <div class="scroll">
    <span>Scroll</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 9l6 6 6-6"/>
    </svg>
  </div>
</main>

<div id="cover"></div>

<script>
(() => {
  /* Each clip carries a `head`: seconds to skip on every start.
     The wave and the idle both open about 2.8 luminance levels darker than they
     settle, recovering over roughly four frames. Starting at 0 therefore plays a
     fast dark-to-bright pulse every time such a clip begins, which is what reads
     as a flash at each loop wrap. Skipping the ramp removes it, and also takes
     the idle's wrap mismatch from 3.88% of pixels to 1.15%.

     The walk clip is the exception, and for a different reason: see its entry
     below. Measure `head` per clip AND per generation. Every number here has
     been wrong at least once by being inherited from the clip it replaced --
     this comment itself previously claimed the walk clip had no ramp at all,
     on a measurement taken from a generation that no longer exists. */
  const CLIPS = {
    /* 3s. Plays once on load, then hands to the idle loop. Measured: the hand
       comes up around 0.7s, the wave peaks at 1.8-2.1s and he has settled by
       2.4s, against the 5s version that did not peak until 1.8s and was still
       moving at 4s. Lands back on the hub pose within 3.5% of pixels. */
    wave: { src: 'media/wave.mp4', head: 0.067 },
    // 10s, locked-off, breathing and blinks only. Measured: his own pixels
    // move across 0.19% of frames on average against 0.38% for the 3.5s clip,
    // and the motorcycle is static rather than drifting across 4.9%.
    idle: { src: 'media/idle.mp4', head: 0.14 },
    /* 9.71s at 24fps, one continuous take: turn, walk, camera swings right,
       Nova crosses and settles on the tower, he sits, the monitor powers on.
       No dissolve, he is never lost from frame, 2.2% duplicate frames, and the
       last frame lands on the pinned end frame within 3.8% of pixels.

       It is a Genjutsu object-replacement pass over the original take, run to
       give the chair its missing armrest. That is a re-render, not an overlay,
       so it came back at 24fps rather than 30 and about 7 luminance levels
       brighter. Neither is corrected here, deliberately:

       - The framerate is not referenced anywhere. The cover handoff reads
         `duration` at runtime, and the monitor still blooms from 8.2s and holds
         solid white to the end, which is where TAKE lands.
       - The brightness is invisible where it would matter. Both layers carry
         --clip-lift, and the studio is 87% of the frame at 221 and 218, which
         both multiply past 255 and clip to white: measured 0.85% of studio
         pixels differ after the lift. Correcting it would also darken the
         final white panel away from --bg, which it currently matches better
         than the original take did.

       head is 0 because for this clip the stitch, not the ramp, is the binding
       constraint. Frame 0 is the closest match to the hub pose (6.6% of pixels)
       and every later frame is worse as he turns away, so the luminance rule's
       answer of frame 9 would have traded a visible pose jump for a 1.5-level
       dip that the crossfade hides anyway. */
    walk: { src: 'media/walk.mp4', head: 0 },
  };
  /* The hub frame, pre-cropped to 16:9 and re-encoded as JPEG (2.81MB -> 0.21MB).
     The source PNG is 2752x1536, which is 1.7917 rather than 16:9's 1.7778, so
     the browser was cover-cropping it at paint time. Cropping it in advance
     means the poster and the clips are the same shape before compositing, and
     measured against the original processed the same way it is +0.03 levels. */
  const POSTER = 'media/hub.jpg';

  /* Fallback source, used only when media/ is empty.

     The files in media/ are the real source and the reason the CDN references
     were removed: Higgsfield result URLs die when a generation is deleted, and
     one already did, which broke the call to action on the deployed page.

     But the files have to be downloaded and committed by hand, and until that
     happens this page renders as bare text. So each asset carries a fallback
     on the Higgsfield CDN, and the page probes for the local poster once at
     boot to decide which set to use. With media/ populated the fallback is
     never requested; with media/ empty the hero still runs.

     These are uploaded media rather than generation results, so they are not
     garbage-collected with a deleted generation. They are still a convenience,
     not a plan. Commit the files. */
  const CDN = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FE0Xjh16Sot9aoCPbOwO7vYemS/';
  const FALLBACK = {
    'media/hub.jpg':  CDN + 'f215c1e8-2364-4cf0-a950-cb1851e8c8b4.jpg',
    'media/wave.mp4': CDN + '2229135a-3e3c-4651-a827-66c8a7af5f4c.mp4',
    'media/idle.mp4': CDN + '9b16a3ef-b3fe-441f-99e6-414ffac6f442.mp4',
    'media/walk.mp4': CDN + 'f8373f35-e3dc-4469-9533-66738f840f3c.mp4',
  };
  let useFallback = false;
  const src = p => (useFallback && FALLBACK[p]) || p;

  // Seconds of crossfade over the idle's wrap. Must match .stage.looping in CSS.
  const XF = 0.34;
  /* Milliseconds of crossfade from the idle into the walk.

     This was 320, then 500, and is now 140. Lengthening it was a mistake and
     it is the white flash Kemal saw at the press.

     The reasoning that produced 500 was right for the wrong quantity. The walk
     clip is a re-render, so it opens on a slightly different pose: the studio
     matches the idle to 0.85% after --clip-lift, but his own pixels differ
     across 47.7%. A longer dissolve is the correct treatment for a LEVEL
     mismatch, where the two images agree on where everything is. For a POSE
     mismatch it is the worst treatment available: for the whole length of the
     blend both versions of him are on screen at partial opacity over a studio
     that --clip-lift has already driven to pure 255, so he washes out toward
     white and then resolves. Nothing on this page is brighter than that
     studio, which is why the artefact reads as white specifically.

     A short blend gives the eye no time to resolve the double exposure, and
     87% of the frame is studio that matches, so there is almost nothing there
     to see a cut in. */
  const WALK_XF = 140;

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const hero = document.getElementById('hero');
  const stage = document.getElementById('stage');
  const poster = document.getElementById('poster');
  const cta = document.getElementById('cta');
  const skip = document.getElementById('skip');
  const cover = document.getElementById('cover');
  const work = document.getElementById('work');
  const A = document.getElementById('vidA');
  const B = document.getElementById('vidB');
  const C = document.getElementById('vidC');

  /* ---- the pill's corner radius ----
     See the .ring rect comment in the CSS: a pill needs rx = ry = half the
     height, which no CSS length expresses, so it is measured. Re-measured on
     resize, which also covers the font arriving late and the font-size clamp
     changing with the viewport. */
  const ringRect = cta.querySelector('.ring rect');
  function sizeRing(){
    const h = cta.getBoundingClientRect().height;
    if (h) cta.style.setProperty('--ring-r', (h / 2) + 'px');
  }
  if (ringRect) {
    sizeRing();
    if (window.ResizeObserver) new ResizeObserver(sizeRing).observe(cta);
    else addEventListener('resize', sizeRing);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeRing);
  }

  /* ---- headline: split to words, rise from below, stagger left to right ---- */
  const h1 = document.getElementById('headline');
  h1.innerHTML = h1.textContent.trim().split(' ').map((w, i) =>
    `<span class="word" style="transition-delay:${i * 90}ms">` +
    `<span style="transition-delay:${i * 90}ms">${w}</span></span>`
  ).join(' ');

  /* ---- layer compositing ----
     A dissolve only looks right if the picture stays opaque all the way
     through it. Fading the outgoing layer out while fading the incoming one
     in does not do that: at the midpoint both sit near 0.5 and roughly a
     quarter of the page background shows through, which brightens the frame
     and reads as a flash. Instead the incoming layer is raised above the
     current one and fades 0 -> 1 while that one holds at full opacity. The
     blend is then exactly alpha*new + (1-alpha)*old, and the old layer is
     only dropped once it is completely covered. */
  let live = null;
  function show(el, ms){
    if (el === live) return;
    const prev = live;
    live = el;
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.zIndex = '3';
    void el.offsetWidth;                       // commit before transitioning
    el.style.transition = ms ? `opacity ${ms}ms linear` : 'none';
    el.style.opacity = '1';
    const settle = () => {
      if (live !== el) return;                 // superseded mid-fade
      el.style.zIndex = '2';
      if (prev && prev !== el) {
        prev.style.transition = 'none';
        prev.style.opacity = '0';
        prev.style.zIndex = '1';
      }
    };
    ms ? setTimeout(settle, ms + 30) : settle();
  }

  function playOnce(el, clip, onEnd, fade){
    el.loop = false;
    el.onended = onEnd || null;
    el.src = src(clip.src);
    atTime(el, clip.head, () => {
      const p = el.play(); if (p && p.catch) p.catch(() => {});
      show(el, fade);
    });
  }

  /* ---- the idle loop ----
     Pinning the end frame does not produce a pixel-exact return: 3.88% of
     pixels differ between the clip's last frame and its first, and searching
     every frame for a better wrap only reaches 3.59%, so trimming does not
     help. Instead two elements hold the same clip and the wrap is crossfaded:
     the outgoing copy plays its tail while the incoming one restarts beneath
     it. Nothing is re-encoded and the full 10s is kept. */
  // Run cb once v is parked at time t with that frame decoded.
  function atTime(v, t, cb){
    if (v.readyState < 2) { v.addEventListener('canplay', () => atTime(v, t, cb), {once:true}); return; }
    if (Math.abs(v.currentTime - t) < 0.02) { cb(); return; }
    v.addEventListener('seeked', cb, {once:true});
    v.currentTime = t;
  }

  let looping = false;
  function idleLoop(){
    const pair = [A, B];
    const clip = CLIPS.idle;
    pair.forEach(v => { v.loop = false; v.onended = null; v.src = src(clip.src); });
    looping = true;
    let i = 0;
    const step = () => {
      if (!looping) return;
      const cur = pair[i];
      // Raise the layer only once the target frame is actually decoded. The
      // element has just played to its end, so raising it while the seek is
      // still in flight would show its last frame for a beat.
      atTime(cur, clip.head, () => {
        if (!looping) return;
        const p = cur.play(); if (p && p.catch) p.catch(() => {});
        show(cur, XF * 1000);
      });
      const watch = () => {
        if (!looping) return;
        const d = cur.duration;
        if (d && cur.currentTime >= d - XF) { i = 1 - i; step(); return; }
        requestAnimationFrame(watch);
      };
      requestAnimationFrame(watch);
    };
    step();
  }

  /* ---- keep the walk clip warm ----
     Setting src at click time means a cold fetch of a multi-megabyte file at
     the exact moment the user is watching for a reaction. Pull it into the
     cache during the idle instead. */
  function warm(clip){
    if (!clip) return;
    const v = document.createElement('video');
    v.preload = 'auto'; v.muted = true; v.src = src(clip.src);
    warm.held = v;
  }

  /* ---- boot ----
     Probe for the local poster before anything loads. A missing file 404s
     immediately, so this costs one round trip and decides the source for every
     asset at once, rather than leaving each element to fail on its own. */
  function boot(){
    poster.onerror = () => stage.classList.add('is-empty');
    A.onerror = B.onerror = C.onerror = () => stage.classList.add('is-empty');
    poster.src = src(POSTER);
    show(poster, 0);
    requestAnimationFrame(() => hero.classList.add('is-in'));

  /* Mobile plays the full sequence too. It used to be excluded along with
     reduced motion, which left phones on a bare poster and made the call to
     action a jump cut into the site. The clips are small enough to serve
     (8.4MB for all four) and autoplay works because they are muted and carry
     `playsinline`; if a browser refuses anyway, play() rejects, the poster
     stays up and the button still works, because that click is a user
     gesture. */
    /* The button is live from the start, but the greeting is never cut short.

       Interrupting the wave mid-gesture to start walking reads as a glitch,
       and it was also what exposed the live-layer bug in enter(). Hiding the
       button until the wave ended solved both and cost more than it was
       worth: it left several seconds where the only interactive thing on the
       page was missing. So the press is banked instead. Click during the
       greeting and the take starts the instant he finishes waving; click
       after it and nothing waits.

       waveOver is latched and also fires on a timer, because a wave that
       stalls or 404s must not swallow a press. */
    const waveOver = () => {
      if (waveEnded) return;
      waveEnded = true;
      if (queued) enter();            // banked press: straight into the take
      else idleLoop();
    };
    if (!reduced) {
      if (CLIPS.wave) {
        playOnce(C, CLIPS.wave, waveOver, 220);
        setTimeout(waveOver, 8000);
      } else { waveEnded = true; idleLoop(); }
      warm(CLIPS.walk);
    } else {
      waveEnded = true;
    }
  }

  const probe = new Image();
  probe.onload  = boot;
  probe.onerror = () => { useFallback = true; boot(); };
  probe.src = POSTER;

  /* Set once the greeting is done, so enter() knows whether to run now or
     bank the press until it is. */
  let waveEnded = false, queued = false, entered = false;

  /* ---- the handoff into the monitor ---- */
  const TAKE = 0.45;                    // must match the `take` animation
  /* Seconds before the end to start pushing the panel to full frame. The clip
     has the monitor solid white from about 8.2s of 9.71s, so the push starts
     once there is nothing left to see but the screen, and the 1400ms transition
     lands as the cover takes over. */
  const ZOOM = 1.5;

  /* Idempotent: the take ending, the watchdog below and the skip button can all
     reach this, and two of them can race on a slow machine. */
  let revealed = false;
  function reveal(){
    if (revealed) return;
    revealed = true;
    work.hidden = false;
    /* Two frames: one for the element to leave `hidden` and be laid out, one
       for the starting styles to be committed. Adding the class in the same
       frame it becomes visible means there is no previous state to animate
       from, and the lines would simply appear. */
    requestAnimationFrame(() => requestAnimationFrame(() => work.classList.add('in')));
    document.body.style.overflow = '';
    hero.style.display = 'none';
    cover.classList.remove('take');
    cover.classList.add('clear');
    window.scrollTo(0, 0);
  }

  // No take available, or one that never arrived: cut straight to the site.
  function hardCut(){ cover.style.opacity = 1; setTimeout(reveal, 180); }

  function enter(){
    /* Pressed mid-greeting: bank it and let him finish waving. waveOver calls
       back in. Nothing else happens yet, so the headline stays up and the
       scene is undisturbed. */
    if (!waveEnded) { queued = true; hero.classList.add('armed'); return; }
    if (entered) return;
    entered = true;
    cta.disabled = true;
    hero.classList.add('is-leaving');   // fade the headline, the CTA and skip
    looping = false;                    // stop the loop watcher
    if (!CLIPS.walk || reduced) { hardCut(); return; }

    /* Pick a layer that is not currently on screen.
       The take used to always load into C, which is also the element the wave
       plays on. Pressing the button during the wave therefore reassigned .src
       on the live layer: show() bails out early when the incoming element is
       already live, so no crossfade ran, and the visible element simply went
       blank while the new file loaded. That is the flash, and it only happened
       when the press landed inside the first five seconds. Gating the button
       until the wave ends removes the trigger; this removes the bug. */
    const W = (live !== C) ? C : ([A, B].find(v => v !== live) || C);

    /* The click has to go somewhere even if the take does not play.
       playOnce waits for the clip to reach readyState 2 before it starts
       anything, so a clip that 404s, is blocked, or stalls on a cold cache
       simply never fires the callback that calls reveal. The button is already
       disabled at that point, which leaves the intro with no exit at all. This
       was not hypothetical: the walk clip's CDN URL started returning 403 and
       the deployed hero's call to action became a dead end.

       So: a load error, or four seconds without playback actually starting,
       falls through to the same instant cut the skip button uses. */
    let running = false, watchdog = 0;
    const bail = () => {
      if (running) return;
      running = true;
      clearTimeout(watchdog);
      hardCut();
    };
    W.addEventListener('playing', () => { running = true; clearTimeout(watchdog); }, { once: true });
    W.addEventListener('error', bail, { once: true });
    watchdog = setTimeout(bail, 4000);

    /* 500ms, not the 320ms the other swaps use. The walk clip is a re-render of
       the original take, so it no longer opens on the hub frame as tightly: the
       studio matches to 0.85% after the lift, but his pixels differ across
       47.7%, against 20.6% for the take it replaces. That is a pose difference,
       not a level difference, so no filter removes it and only the blend can
       cover it. The first half second of the clip is him turning away, which is
       the cheapest half second in the take to spend on a dissolve. */
    playOnce(W, CLIPS.walk, reveal, WALK_XF);

    // Hand over during the clip's final stretch, by which point the monitor has
    // powered on inside the shot and the frame is mostly white.
    let zoomed = false, armed = false;
    const at = () => {
      const end = W.duration || 10;
      if (!zoomed && W.currentTime >= end - ZOOM) {
        zoomed = true;
        W.classList.add('zoom');        // push the panel to full frame
      }
      if (!armed && W.currentTime >= end - TAKE) {
        armed = true;
        cover.classList.add('take');
      }
    };
    if (W.requestVideoFrameCallback) {
      const tick = () => { at(); if (!armed) W.requestVideoFrameCallback(tick); };
      W.requestVideoFrameCallback(tick);
    } else {
      W.addEventListener('timeupdate', at);
    }
  }

  cta.addEventListener('click', enter);
  skip.addEventListener('click', () => {
    queued = false;                     // drop any banked press
    entered = true;                     // and stop waveOver reviving it
    looping = false;
    hardCut();
  });
})();
</script>
</body>
</html>
