<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kemal Rahman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Page tone, taken from the Figma reference. */
  --bg:#f1f0ee;
  --ink:#0a0a0a;

  /* The clips render their studio at about 222 luminance, the design sits
     nearer 241. This lifts the video to match instead of dulling the page. */
  --clip-lift:1.085;
  --clip-warm:1.02;

  --pad:clamp(20px,3.4vw,64px);
  --head:clamp(52px,11.6vw,196px);
  --stage-max:1800px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;width:100%;overflow:hidden;isolation:isolate}

.stage{position:absolute;inset:0;z-index:0}
/* Layers start transparent and are driven entirely from the script. There is
   deliberately no transition here: fading two stacked layers at once lets the
   page background show through the middle of the blend, which reads as a
   flash on every swap. The script raises the incoming layer over an outgoing
   one that stays fully opaque, so the two always sum to a solid picture. */
.stage video,.stage img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center bottom;
  filter:brightness(var(--clip-lift)) saturate(var(--clip-warm));
  opacity:0;z-index:1;
}

/* Shown only when the clips cannot be fetched, so the layout still reads. */
.stage-missing{
  position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
  width:min(62%,880px);aspect-ratio:16/9;
  border:2px dashed rgba(10,10,10,.22);border-radius:12px;
  display:none;place-items:center;text-align:center;
  color:rgba(10,10,10,.42);font-size:14px;line-height:1.5;padding:20px;
}
.stage.is-empty .stage-missing{display:grid}

.overlay{
  position:relative;z-index:2;min-height:100svh;
  max-width:var(--stage-max);margin:0 auto;padding:var(--pad);
  display:grid;grid-template-rows:auto 1fr;pointer-events:none;
}

/* ---------- headline ---------- */
h1{
  margin:0;font-weight:800;letter-spacing:-.045em;line-height:.92;
  font-size:var(--head);
}
.word{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.word > span{
  display:inline-block;transform:translateY(110%);
  transition:transform .82s cubic-bezier(.16,1,.3,1);
}
.is-in .word > span{transform:translateY(0)}

/* ---------- call to action ---------- */
.cta-wrap{display:flex;align-items:center;justify-content:flex-end;padding-right:clamp(0px,4vw,90px)}
.cta{
  pointer-events:auto;appearance:none;cursor:pointer;
  font:inherit;font-weight:700;font-size:clamp(17px,1.65vw,27px);
  letter-spacing:-.01em;color:var(--ink);background:transparent;
  border:2px dashed var(--ink);border-radius:999px;
  padding:.62em 1.25em;display:inline-flex;align-items:center;gap:.6em;
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease .55s,transform .5s cubic-bezier(.16,1,.3,1) .55s,
             background-color .18s ease,color .18s ease;
}
.is-in .cta{opacity:1;transform:translateY(0)}
.cta:hover,.cta:focus-visible{background:var(--ink);color:var(--bg)}
.cta .arw{transition:transform .18s ease}
.cta:hover .arw{transform:translateX(4px)}

/* ---------- skip ---------- */
.skip{
  position:absolute;left:var(--pad);bottom:var(--pad);z-index:3;pointer-events:auto;
  appearance:none;border:0;background:transparent;font:inherit;font-size:14px;
  color:var(--ink);opacity:.45;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;
}
.skip:hover{opacity:.85}

/* ---------- the handoff ---------- */
/* The monitor's power-on flicker happens inside the clip, so this cover has
   only one job: close the gap between the video's white and the page's white.
   Video encodes limited range, so its white lands near 235 while the page is
   255, and cutting between the two is a visible step. Ramping up to an opaque
   CSS white hides it, because the move is toward white rather than a match. */
#cover{
  position:fixed;inset:0;z-index:40;background:#fff;
  opacity:0;pointer-events:none;
}
#cover.take{animation:take 450ms ease-in forwards}
@keyframes take{from{opacity:0} to{opacity:1}}
#cover.clear{opacity:0;transition:opacity .5s ease}

/* ---------- the site under the hero ---------- */
.work{max-width:var(--stage-max);margin:0 auto;padding:clamp(60px,9vw,150px) var(--pad)}
.work h2{font-size:clamp(28px,4.4vw,64px);letter-spacing:-.035em;margin:0 0 .5em}
.grid{display:grid;gap:clamp(14px,1.8vw,26px);grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{aspect-ratio:4/3;border-radius:14px;background:#e4e3e0;display:grid;place-items:center;
  color:#8d8b87;font-weight:500}

@media (max-width:760px){
  h1{font-size:clamp(42px,13.5vw,90px)}
  .cta-wrap{justify-content:flex-start;align-items:flex-end;padding:0 0 16vh}
}
@media (prefers-reduced-motion:reduce){
  .word > span{transition:none;transform:none}
  .cta{transition:none;opacity:1;transform:none}
  #cover.take{animation:none;opacity:1}
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="stage" id="stage">
    <img id="poster" alt="" src="">
    <video id="vidA" playsinline muted preload="auto"></video>
    <video id="vidB" playsinline muted preload="auto"></video>
    <video id="vidC" playsinline muted preload="auto"></video>
    <div class="stage-missing">
      Scene clips can&rsquo;t be fetched from here.<br>
      Layout, type and motion above are live.
    </div>
  </div>

  <div class="overlay">
    <h1 id="headline">Hi, I&rsquo;m Kemal</h1>
    <div class="cta-wrap">
      <button class="cta" id="cta">Cool Sh*t <span class="arw">&rarr;</span></button>
    </div>
  </div>

  <button class="skip" id="skip">Skip intro</button>
</section>

<main class="work" id="work" hidden>
  <h2>Selected work</h2>
  <div class="grid">
    <div class="card">Case study</div><div class="card">Case study</div>
    <div class="card">Case study</div><div class="card">Case study</div>
  </div>
</main>

<div id="cover"></div>

<script>
(() => {
  /* Each clip carries a `head`: seconds to skip on every start.
     Both generated clips open 2.8 luminance levels darker than they settle,
     recovering over about four frames. Starting at 0 therefore plays a fast
     dark-to-bright pulse every time a clip begins, which is what reads as a
     flash at each loop wrap. Skipping the ramp removes it, and also takes the
     idle's wrap mismatch from 3.88% of pixels to 1.15%. The values are the
     first frame measured within 0.3 levels of each clip's settled value. */
  const CLIPS = {
    // Wave plays once on load, then hands to the idle loop. The arm starts
    // rising at 0.5s and peaks 1.5-3.4s, which lands it mid-headline.
    wave: { src: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FE0Xjh16Sot9aoCPbOwO7vYemS/'
               + 'ed3c524f-cea1-4b6c-8683-46edd68f159f.mp4', head: 0.11 },
    // 10s, locked-off, breathing and blinks only. Measured: his own pixels
    // move across 0.19% of frames on average against 0.38% for the 3.5s clip,
    // and the motorcycle is static rather than drifting across 4.9%.
    idle: { src: 'https://d8j0ntlcm91z4.cloudfront.net/user_3FE0Xjh16Sot9aoCPbOwO7vYemS/'
               + 'hf_20260919_182126_adac86ab-3d37-41ff-860a-4c713b405a9c.mp4', head: 0.14 },
    walk: null,                                        // pending generation
  };
  const POSTER = 'https://d8j0ntlcm91z4.cloudfront.net/user_3FE0Xjh16Sot9aoCPbOwO7vYemS/'
               + 'hf_20260918_131857_3f470988-9df8-4d61-98f6-e316d6f6ad9e.png';

  // Seconds of crossfade over the idle's wrap. Must match .stage.looping in CSS.
  const XF = 0.34;

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobile  = matchMedia('(max-width: 760px)').matches;

  const hero = document.getElementById('hero');
  const stage = document.getElementById('stage');
  const poster = document.getElementById('poster');
  const cta = document.getElementById('cta');
  const skip = document.getElementById('skip');
  const cover = document.getElementById('cover');
  const work = document.getElementById('work');
  const A = document.getElementById('vidA');
  const B = document.getElementById('vidB');
  const C = document.getElementById('vidC');

  /* ---- headline: split to words, rise from below, stagger left to right ---- */
  const h1 = document.getElementById('headline');
  h1.innerHTML = h1.textContent.trim().split(' ').map((w, i) =>
    `<span class="word" style="transition-delay:${i * 90}ms">` +
    `<span style="transition-delay:${i * 90}ms">${w}</span></span>`
  ).join(' ');

  /* ---- layer compositing ----
     A dissolve only looks right if the picture stays opaque all the way
     through it. Fading the outgoing layer out while fading the incoming one
     in does not do that: at the midpoint both sit near 0.5 and roughly a
     quarter of the page background shows through, which brightens the frame
     and reads as a flash. Instead the incoming layer is raised above the
     current one and fades 0 -> 1 while that one holds at full opacity. The
     blend is then exactly alpha*new + (1-alpha)*old, and the old layer is
     only dropped once it is completely covered. */
  let live = null;
  function show(el, ms){
    if (el === live) return;
    const prev = live;
    live = el;
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.zIndex = '3';
    void el.offsetWidth;                       // commit before transitioning
    el.style.transition = ms ? `opacity ${ms}ms linear` : 'none';
    el.style.opacity = '1';
    const settle = () => {
      if (live !== el) return;                 // superseded mid-fade
      el.style.zIndex = '2';
      if (prev && prev !== el) {
        prev.style.transition = 'none';
        prev.style.opacity = '0';
        prev.style.zIndex = '1';
      }
    };
    ms ? setTimeout(settle, ms + 30) : settle();
  }

  function playOnce(el, clip, onEnd, fade){
    el.loop = false;
    el.onended = onEnd || null;
    el.src = clip.src;
    atTime(el, clip.head, () => {
      const p = el.play(); if (p && p.catch) p.catch(() => {});
      show(el, fade);
    });
  }

  /* ---- the idle loop ----
     Pinning the end frame does not produce a pixel-exact return: 3.88% of
     pixels differ between the clip's last frame and its first, and searching
     every frame for a better wrap only reaches 3.59%, so trimming does not
     help. Instead two elements hold the same clip and the wrap is crossfaded:
     the outgoing copy plays its tail while the incoming one restarts beneath
     it. Nothing is re-encoded and the full 10s is kept. */
  // Run cb once v is parked at time t with that frame decoded.
  function atTime(v, t, cb){
    if (v.readyState < 2) { v.addEventListener('canplay', () => atTime(v, t, cb), {once:true}); return; }
    if (Math.abs(v.currentTime - t) < 0.02) { cb(); return; }
    v.addEventListener('seeked', cb, {once:true});
    v.currentTime = t;
  }

  let looping = false;
  function idleLoop(){
    const pair = [A, B];
    const clip = CLIPS.idle;
    pair.forEach(v => { v.loop = false; v.onended = null; v.src = clip.src; });
    looping = true;
    let i = 0;
    const step = () => {
      if (!looping) return;
      const cur = pair[i];
      // Raise the layer only once the target frame is actually decoded. The
      // element has just played to its end, so raising it while the seek is
      // still in flight would show its last frame for a beat.
      atTime(cur, clip.head, () => {
        if (!looping) return;
        const p = cur.play(); if (p && p.catch) p.catch(() => {});
        show(cur, XF * 1000);
      });
      const watch = () => {
        if (!looping) return;
        const d = cur.duration;
        if (d && cur.currentTime >= d - XF) { i = 1 - i; step(); return; }
        requestAnimationFrame(watch);
      };
      requestAnimationFrame(watch);
    };
    step();
  }

  /* ---- keep the walk clip warm ----
     Setting src at click time means a cold fetch of a multi-megabyte file at
     the exact moment the user is watching for a reaction. Pull it into the
     cache during the idle instead. */
  function warm(clip){
    if (!clip) return;
    const v = document.createElement('video');
    v.preload = 'auto'; v.muted = true; v.src = clip.src;
    warm.held = v;
  }

  /* ---- boot ---- */
  poster.onerror = () => stage.classList.add('is-empty');
  A.onerror = B.onerror = C.onerror = () => stage.classList.add('is-empty');
  poster.src = POSTER;
  show(poster, 0);
  requestAnimationFrame(() => hero.classList.add('is-in'));

  if (!reduced && !mobile) {
    if (CLIPS.wave) playOnce(C, CLIPS.wave, idleLoop, 220);
    // (wave hands to idleLoop on `ended`)
    else idleLoop();
    warm(CLIPS.walk);
  }

  /* ---- the handoff into the monitor ---- */
  const TAKE = 0.45;                    // must match the `take` animation

  function reveal(){
    work.hidden = false;
    document.body.style.overflow = '';
    hero.style.display = 'none';
    cover.classList.remove('take');
    cover.classList.add('clear');
    window.scrollTo(0, 0);
  }

  function enter(){
    cta.disabled = true;
    looping = false;                    // stop the loop watcher
    if (!CLIPS.walk || reduced || mobile) { cover.style.opacity = 1; setTimeout(reveal, 180); return; }
    playOnce(C, CLIPS.walk, reveal, 320);

    // Hand over during the clip's final stretch, by which point the monitor has
    // powered on inside the shot and the frame is mostly white.
    let armed = false;
    const at = () => {
      const end = C.duration || 10;
      if (!armed && C.currentTime >= end - TAKE) { armed = true; cover.classList.add('take'); }
    };
    if (C.requestVideoFrameCallback) {
      const tick = () => { at(); if (!armed) C.requestVideoFrameCallback(tick); };
      C.requestVideoFrameCallback(tick);
    } else {
      C.addEventListener('timeupdate', at);
    }
  }

  cta.addEventListener('click', enter);
  skip.addEventListener('click', () => {
    looping = false;
    cover.style.opacity = 1; setTimeout(reveal, 160);
  });
})();
</script>
</body>
</html>
