<!doctype html><html><head><meta charset="utf-8">
<link href="fonts/local.css" rel="stylesheet">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
/* Portfolio reel compositor.
   Every frame is drawn from a timeline of shots (source clips with a speed map,
   a transform and an opacity) plus type layers. Fast frames are drawn several
   times across a half-frame shutter and averaged, which is the motion blur. */
const W=1920,H=1080,FPS=60,SHUTTER=0.5;
const BG='#f1f0ee',INK='#0a0a0a';
const COUNT={VA:118,VC:136,LA:59,LB:189,FL:180,OS:361,GF:105,PM:135};

/* ---------- easing ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t;
const outCubic=x=>1-Math.pow(1-x,3),inCubic=x=>x*x*x,inOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const outQuart=x=>1-Math.pow(1-x,4),inQuart=x=>x*x*x*x;
const outExpo=x=>x>=1?1:1-Math.pow(2,-10*x),inExpo=x=>x<=0?0:Math.pow(2,10*x-10);
const seg=(f,a,b)=>clamp((f-a)/(b-a));
/* piecewise-linear speed map: [[localSec, srcSec], ...] */
const pw=pts=>lt=>{for(let i=1;i<pts.length;i++){if(lt<=pts[i][0]){const[a,b]=[pts[i-1],pts[i]];return lerp(a[1],b[1],clamp((lt-a[0])/(b[0]-a[0])));}}return pts[pts.length-1][1];};

/* ---------- images ---------- */
const pad=i=>String(i).padStart(4,'0');
const url=(k,i)=>k==='GF'?`mont/gf/${pad(i)}.jpg`:k==='PM'?`mont/pm/${pad(i)}.jpg`:k==='PS'?'polaris.png':`mont/src/${k}/${pad(i)}.jpg`;
const cache=new Map();
async function bmp(k,i){const u=url(k,i);if(cache.has(u)){const v=cache.get(u);cache.delete(u);cache.set(u,v);return v;}
  const b=await createImageBitmap(await (await fetch(u)).blob());cache.set(u,b);
  while(cache.size>36){const [ku,kv]=cache.entries().next().value;kv.close&&kv.close();cache.delete(ku);}return b;}

/* ---------- the edit (global frames @60) ---------- */
// Polaris screenshot as the 3D screen showed it on the last MacBook frame (calibrated)
const PS0={x:-23,y:-96,w:1966,h:1272,sx:0.983,sy:1.0209};
const PS_T0={x:-23+0.983*990,y:-96+1.0209*227.5};      // "trade" in Polaris at the hand-off
const OS_T={x:680,y:631};                               // "trade" in Osmosis hero
const PS_F0=520,PS_F1=543,PS_ZEND=5.14,PS_L=Math.log(PS_ZEND);
function psState(f){const u=clamp((f-PS_F0)/(PS_F1-PS_F0));const z=Math.exp(PS_L*u);
  const vcE={x:PS_T0.x-(OS_T.x-960)/PS_ZEND,y:PS_T0.y-(OS_T.y-540)/PS_ZEND};
  const g=(1-1/z)/(1-1/PS_ZEND);const vc={x:lerp(960,vcE.x,g),y:lerp(540,vcE.y,g)};
  return {z,vc,P:{x:(PS_T0.x-vc.x)*z+960,y:(PS_T0.y-vc.y)*z+540}};}
const ROTOR={x:956,y:526},VCWHEEL={x:1366,y:736},LB2_PUSH=1.1,VC2_S0=500*LB2_PUSH/124;

const id={s:1,fx:960,fy:540,tx:0,ty:0};
const about=(s,p,q=p)=>({s,fx:p.x,fy:p.y,tx:q.x-p.x,ty:q.y-p.y});
const punch=(f,a,amt=0.07,len=10,drift=0.02,dlen=40)=>({...id,s:1+amt*(1-outCubic(seg(f,a,a+len)))+drift*seg(f,a,a+dlen)});

const SHOTS=[
 // 1. Vanta: off-white page, the window opens on the car (type sits on top)
 {k:'VA',a:0,b:72,map:pw([[0,0],[0.4,0.3],[1.2,1.3]]),xf:f=>({...id,s:1+0.03*seg(f,0,72)}),
  alpha:f=>seg(f,18,26),filter:()=> 'brightness(1.02)'},
 // 2. Loco: the name lands
 {k:'LA',a:72,b:108,map:lt=>lt*1.63,xf:f=>punch(f,72)},
 // 3. Flowerbx: everything in season
 {k:'FL',a:108,b:138,map:lt=>0.3+lt*2,xf:f=>punch(f,108,0.06)},
 // 4. Osmosis, first half: dive into the hero, then keep diving
 {k:'OS',a:138,b:170,map:lt=>0.45+lt*2.25,xf:f=>about(1+0.6*inCubic(seg(f,160,170)),OS_T),blur:f=>f>=158?6:1},
 // 5. G-Force: pulled back out of the dive, then whipped off left
 {k:'GF',a:166,b:277,idx:f=>f-166+1,alpha:f=>seg(f,166,170),xf:f=>({...id,tx:-W*inOutCubic(seg(f,263,275))}),blur:f=>f<172||f>=262?8:1},
 // 6. Vanta: whipped in from the right, side profile into x-ray
 {k:'VC',a:263,b:325,map:lt=>0.1+lt,xf:f=>({...id,tx:W-W*inOutCubic(seg(f,263,275))}),blur:f=>f<276?8:1},
 // 7. Loco: the service gear, then into its dark centre
 {k:'LB',a:325,b:385,map:pw([[0,0.12],[0.667,1.5],[1.0,1.85]]),xf:f=>punch(f,325,0.08,10,0)},
 // 8. Polaris: half spin, lid opens, push into the screen
 {k:'PM',a:385,b:520,idx:f=>f-385+1,xf:f=>({...id,s:1+0.1*(1-outCubic(seg(f,385,397)))}),filter:f=>`brightness(${f<395?lerp(0.25,1.16,outCubic(seg(f,385,395))):lerp(1.16,1,seg(f,440,478))}) contrast(1.04)`,blur:f=>f<392||f>=500?6:1},
 // 9. Polaris screenshot: keep pushing, straight into "trade"
 {k:'PS',a:520,b:543,still:true,blur:()=>6},
 // 10. Osmosis, second half: "trade" hands over, then the swaps
 {k:'OS',a:538,b:622,map:lt=>1.95+(lt-5/60)*2.0,alpha:f=>seg(f,538,543),
  xf:f=>{if(f<543){const st=psState(f);return about(1.5*st.z/PS_ZEND,OS_T,st.P);}return about(1+0.5*(1-outCubic(seg(f,543,559))),OS_T);},
  filter:f=>f>=614?`brightness(${lerp(1,2.6,inCubic(seg(f,614,622)))}) saturate(${lerp(1,0.6,seg(f,614,622))})`:'none',blur:f=>f<556?6:1},
 // 11. Flowerbx: out of the white, close on the ranunculus
 {k:'FL',a:622,b:682,map:lt=>1.8+lt*1.2,xf:f=>({...id,s:1+0.03*seg(f,622,682)}),filter:f=>`brightness(${lerp(2.4,1,outCubic(seg(f,622,634)))})`},
 // 12. Vanta: the name, on black
 {k:'VA',a:682,b:718,map:lt=>1.40+lt*0.95,xf:f=>punch(f,682,0.07)},
 // 13. Loco: rotor reveal, then push into the disc
 {k:'LB',a:718,b:778,map:lt=>1.93+lt*1.22,xf:f=>about(1+(LB2_PUSH-1)*inCubic(seg(f,770,778)),ROTOR),blur:f=>f>=770?6:1},
 // 14. Vanta: out of the brake disc to the whole x-ray car
 {k:'VC',a:774,b:852,map:lt=>0.95+lt*1.2,alpha:f=>seg(f,774,778),
  xf:f=>{const r=1-outQuart(seg(f,774,804));return {s:1+(VC2_S0-1)*r,fx:VCWHEEL.x,fy:VCWHEEL.y,tx:(ROTOR.x-VCWHEEL.x)*r,ty:(ROTOR.y-VCWHEEL.y)*r};},blur:f=>f<790?8:1},
];
const EDIT_N=943;
const WARP=[[172,262,1.3],[392,440,1.3]];           // [editFrom, editTo, speed]
const KN=(()=>{const k=[[0,0]];let o=0,e=0;for(const[a,b,sp]of WARP){o+=a-e;k.push([o,a]);o+=(b-a)/sp;k.push([o,b]);e=b;}o+=EDIT_N-e;k.push([o,EDIT_N]);return k;})();
const toEdit=fo=>{for(let i=1;i<KN.length;i++)if(fo<=KN[i][0]){const[a,b]=[KN[i-1],KN[i]];return lerp(a[1],b[1],(fo-a[0])/(b[0]-a[0]));}return EDIT_N;};
const N=Math.round(KN[KN.length-1][0]);
const LABELS=[
 {a:186,b:258,name:'G-Force',kind:'iOS app'},
 {a:281,b:322,name:'Vanta',kind:'Exotic auto repair · Web'},
 {a:333,b:380,name:'Loco Exotics',kind:'Car repair · Web'},
 {a:430,b:500,name:'Polaris',kind:'Trading app · Product'},
 {a:566,b:612,name:'Osmosis',kind:'DEX · Product',y:190},
 {a:634,b:678,name:'Flowerbx',kind:'Florist · Demo',ink:true},
];

/* ---------- type ---------- */
function layout(ctx,parts){let x=0;const gl=[];for(const p of parts){ctx.font=p.font;ctx.letterSpacing=(p.ls||0)+'px';
  for(let i=0;i<p.t.length;i++)gl.push({ch:p.t[i],x:x+ctx.measureText(p.t.slice(0,i)).width,font:p.font,ls:p.ls||0});
  x+=ctx.measureText(p.t).width;}return {gl,w:x};}
/* glyphs rise into a mask, and rise out of it */
function kinetic(ctx,parts,x,base,f,o){
  const {fin,fout=null,st=1.2,dur=16,ost=0.8,odur=12,color='#fff',comp='source-over',up=1.0,down=0.32,align='center',shadow=null}=o;
  const L=layout(ctx,parts);const x0=align==='center'?x-L.w/2:x;
  const size=parseFloat(/(\d+)px/.exec(parts[0].font)[1]),top=size*up,bot=size*down,h=top+bot;
  ctx.save();ctx.globalCompositeOperation=comp;ctx.fillStyle=color;
  if(shadow){ctx.shadowColor=shadow;ctx.shadowBlur=18;ctx.shadowOffsetY=2;}
  ctx.beginPath();ctx.rect(0,base-top,W,h);ctx.clip();
  L.gl.forEach((g,i)=>{const pi=clamp((f-fin-i*st)/dur);if(pi<=0||g.ch===' ')return;
    const po=fout==null?0:clamp((f-fout-i*ost)/odur);if(po>=1)return;
    const dy=(1-outExpo(pi))*h-inExpo(po)*h;
    ctx.font=g.font;ctx.letterSpacing=g.ls+'px';ctx.fillText(g.ch,x0+g.x,base+dy);});
  ctx.restore();return L.w;}

function drawIntro(ctx,f){
  if(f>72)return;
  kinetic(ctx,[{t:'Selected ',font:'800 196px "Inter Tight"',ls:-8},{t:'work',font:'italic 400 236px "Instrument Serif"',ls:-3}],
    960,598,f,{fin:2,fout:44,st:1.3,dur:18,ost:0.55,odur:12,comp:'difference'});
  kinetic(ctx,[{t:'KEMAL RAHMAN — 2024/26',font:'500 20px "JetBrains Mono"',ls:5}],960,410,f,{fin:12,fout:42,st:0.5,dur:14,ost:0.3,odur:10,comp:'difference'});
}
function drawLabels(ctx,f){
  for(const l of LABELS){if(f<l.a||f>l.b)continue;const y=l.y||960;
    const c1=l.ink?INK:'#fff',c2=l.ink?'rgba(10,10,10,.7)':'rgba(255,255,255,.8)',sh=l.ink?null:'rgba(0,0,0,.35)';
    kinetic(ctx,[{t:l.name,font:'700 52px "Inter Tight"',ls:-1.5}],150,y,f,{fin:l.a,fout:l.b-14,st:0.9,dur:16,ost:0.5,odur:12,align:'left',color:c1,shadow:sh,down:0.3});
    kinetic(ctx,[{t:l.kind.toUpperCase(),font:'500 18px "JetBrains Mono"',ls:3.5}],153,y+41,f,{fin:l.a+4,fout:l.b-12,st:0.35,dur:14,ost:0.2,odur:10,align:'left',color:c2,shadow:sh});}
}
const OUT_A=838;
function drawOutro(ctx,f){
  if(f<OUT_A)return;
  const p=inOutCubic(seg(f,OUT_A,OUT_A+14));ctx.fillStyle=BG;ctx.fillRect(0,H*(1-p),W,H*p+1);
  kinetic(ctx,[{t:'One designer.',font:'800 150px "Inter Tight"',ls:-6}],960,478,f,{fin:OUT_A+8,fout:OUT_A+74,st:1.1,dur:18,ost:0.6,odur:14,color:INK});
  kinetic(ctx,[{t:'Every ',font:'800 150px "Inter Tight"',ls:-6},{t:'discipline.',font:'italic 400 182px "Instrument Serif"',ls:-2}],960,640,f,{fin:OUT_A+16,fout:OUT_A+78,st:1.1,dur:18,ost:0.6,odur:14,color:INK});
  // signature, written on
  const wp=seg(f,OUT_A+34,OUT_A+60),wo=seg(f,OUT_A+76,OUT_A+88);
  if(wp>0&&wo<1){ctx.save();ctx.translate(1235,742);ctx.rotate(-0.09);ctx.font='400 66px "Kaushan Script"';ctx.letterSpacing='0px';
    const tw=ctx.measureText('Kemal Rahman').width;ctx.beginPath();ctx.rect(-8,-80,(tw+16)*inOutCubic(wp),120);ctx.clip();
    ctx.globalAlpha=1-wo;ctx.fillStyle=INK;ctx.fillText('Kemal Rahman',0,-30*inCubic(wo)*0);ctx.restore();}
}

/* ---------- compose one instant ---------- */
const work=document.createElement('canvas');work.width=W;work.height=H;const wc=work.getContext('2d');
const outC=document.getElementById('out'),oc=outC.getContext('2d');
function active(f){return SHOTS.filter(s=>f>=s.a&&f<s.b);}
function srcIndex(s,f){if(s.still)return 1;if(s.idx)return clamp(Math.round(s.idx(f)),1,COUNT[s.k]);
  const lt=(f-s.a)/FPS;return clamp(Math.round(s.map(lt)*60)+1,1,COUNT[s.k]);}
async function need(f){return Promise.all(active(f).map(async s=>[s,await bmp(s.k,srcIndex(s,f))]));}
function compose(ctx,f,pairs){
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  for(const [s,b] of pairs){
    const a=s.alpha?s.alpha(f):1;if(a<=0)continue;
    ctx.save();ctx.globalAlpha=a;const fl=s.filter?s.filter(f):'none';if(fl&&fl!=='none')ctx.filter=fl;
    if(s.still){const st=psState(f);ctx.translate(960,540);ctx.scale(st.z,st.z);ctx.translate(-st.vc.x,-st.vc.y);ctx.drawImage(b,PS0.x,PS0.y,PS0.w,PS0.h);}
    else{const x=s.xf?s.xf(f):id;ctx.translate(x.fx+x.tx,x.fy+x.ty);ctx.scale(x.s,x.s);ctx.translate(-x.fx,-x.fy);
      const sc=Math.max(W/b.width,H/b.height),dw=b.width*sc,dh=b.height*sc;ctx.drawImage(b,(W-dw)/2,(H-dh)/2,dw,dh);}
    ctx.restore();}
  drawIntro(ctx,f);drawLabels(ctx,f);drawOutro(ctx,f);
}
function blurN(f){let n=1;for(const s of active(f))if(s.blur)n=Math.max(n,s.blur(f));return n;}
window.N=N;
window.renderFrame=async(fo,q=0.95)=>{
  const f=toEdit(fo);const n=blurN(f);const ts=n===1?[f]:Array.from({length:n},(_,k)=>toEdit(fo+((k+0.5)/n-0.5)*SHUTTER));
  oc.globalAlpha=1;oc.clearRect(0,0,W,H);
  for(let k=0;k<ts.length;k++){const t=Math.max(0,ts[k]);const pairs=await need(t);compose(wc,t,pairs);oc.globalAlpha=1/(k+1);oc.drawImage(work,0,0);}
  oc.globalAlpha=1;return outC.toDataURL('image/jpeg',q);
};
await Promise.all(['800 100px "Inter Tight"','700 100px "Inter Tight"','italic 400 100px "Instrument Serif"','500 20px "JetBrains Mono"','400 60px "Kaushan Script"'].map(s=>document.fonts.load(s)));
await document.fonts.ready;
window.fontsOK=['800 100px "Inter Tight"','italic 400 100px "Instrument Serif"','500 20px "JetBrains Mono"','400 60px "Kaushan Script"'].map(s=>document.fonts.check(s));
window.ready=true;
</script></body></html>
